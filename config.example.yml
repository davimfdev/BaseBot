# Top-Level Config Keys:
# - discord
# - postgres
# - sqlite
# - tickets
# - ratelimit
# [OUTLINE END]



# ---------------------------------------------------------------------------
# BaseBot configuration template.
# Copy to `config.yml` and fill in real values, OR provide everything via
# environment variables (env vars win over file values). See ConfigLoader.
# config.yml is git-ignored — never commit real secrets.
# ---------------------------------------------------------------------------

discord:
  # Bot token from the Discord Developer Portal. Env: BOT_TOKEN
  token: "YOUR_BOT_TOKEN"
  # Optional: id of a storage-only "attachment vault" guild. The bot is a member only
  # to stash attachments there; it never registers slash commands in it. Every other
  # guild the bot joins gets commands automatically. Leave blank/null to disable.
  # Env: VAULT_GUILD_ID
  vaultGuildId: null

# PostgreSQL — source of truth for Guild Configurations (Setup, Roles, Toggles).
# Today the dashboard uses Supabase; this will migrate to a dedicated Neon schema.
# The bot talks plain JDBC so it works against either. Env: POSTGRES_URL etc.
postgres:
  # Full connection string. Accepts a Neon/libpq URI with embedded credentials
  # (postgresql://user:pass@HOST/DB?sslmode=require) or a jdbc:postgresql://... URL.
  url: "postgresql://user:password@HOST/basebot?sslmode=require"
  # Optional — only needed if the url above has no embedded credentials.
  username: ""
  password: ""
  maxPoolSize: 5
  # Schema that holds guild config tables. Lets the Supabase->Neon move be a config change.
  schema: "public"

# SQLite — fast local transactions: active tickets, action logs, ephemeral state.
sqlite:
  # File path relative to the working directory. Env: SQLITE_PATH
  path: "data/basebot.db"

# Ticket transcript pipeline -> davimf.dev web dashboard.
# Must match netlify/functions/ticket-store.ts. See crypto/TicketCrypto.
tickets:
  # POST endpoint that ingests encrypted transcripts. Env: TICKET_INGEST_URL
  ingestUrl: "https://davimf.dev/api/ticket-store"
  # Shared secret -> sent as `x-ticket-secret`. Env: TICKET_INGEST_SECRET
  ingestSecret: "CHANGE_ME"
  # Public base for the "view transcript" button: {base}/ticket/{id}. Env: TICKET_VIEW_BASE
  viewBaseUrl: "https://davimf.dev/ticket"
  # PBKDF2 iteration count for transcript encryption (must be honored on decrypt side).
  pbkdf2Iterations: 210000
  # "source" tag stored with each transcript row.
  source: "basebot"

# Rate-limit guards (see ratelimit/).
ratelimit:
  # Debounce window (ms) before refreshing public embeds (Hierarchy panel, etc.).
  embedDebounceMillis: 5000
  # Ghost-ping throttle: how many mentions per batch and the gap between batches.
  ghostPingBatchSize: 5
  ghostPingBatchIntervalSeconds: 30

# Identidade desta instância do bot (1 bot por cliente) — usada para publicar
# snapshots no dashboard. Sem instanceId os snapshots ficam desligados.
# instance:
#   # UUID estável gerado para esta instância. Env: BOT_INSTANCE_ID
#   instanceId: null
#   # Nome do cliente exibido no dashboard. Env: BOT_CLIENT_NAME
#   clientName: null
