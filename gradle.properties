# JVM args for the Gradle daemon. Generous heap for the JDA + driver dependency graph.
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8

# Gradle 8.14 cannot run on JDK 26, so launch the daemon with the locally-installed
# JDK 22 (which is also the project toolchain). Remove/adjust this line if your JDK 22
# lives elsewhere or once Gradle gains JDK 26 support.
org.gradle.java.home=C:\\Program Files\\Java\\jdk-22

# Faster, more reliable builds.
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.configuration-cache=true
